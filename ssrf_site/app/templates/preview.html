<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Prévisualisation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { text-align: center; margin-top: 50px; }
        iframe { width: 80%; height: 600px; border: 1px solid black; }
        .container { max-width: 800px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Prévisualisation</h1>

        {% if error %}
            <div class="alert alert-danger">Erreur : {{ error }}</div>
        {% elif iframe_url %}
            <p><strong>Affichage en temps réel :</strong></p>
            <iframe src="{{ iframe_url }}"></iframe>
        {% else %}
            <p>Ce site ne permet pas l'intégration en `iframe`.</p>
            <div class="border p-3" style="text-align: left;">
                {{ html_content | safe }}
            </div>
        {% endif %}

        <br>
        <a href="/visualizer" class="btn btn-secondary">Retour</a>
    </div>
</body>
</html>
